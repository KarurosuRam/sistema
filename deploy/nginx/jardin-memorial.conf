# Jardín Memorial · proxy inverso para la app Node (opción B, sin Docker).
#
#   1. copiar a /etc/nginx/sites-available/jardin-memorial
#   2. enlazar en sites-enabled
#   3. cambiar server_name por el subdominio real
#   4. nginx -t && systemctl reload nginx
#   5. certbot --nginx -d memoriales.tudominio.cl
#
# Certbot agrega el bloque 443, el certificado y la redirección desde HTTP.
# Este archivo solo escucha en 80 para que la primera emisión funcione.

server {
    listen 80;
    listen [::]:80;

    server_name memoriales.tudominio.cl;

    # Video de 60 s (hasta 120 MB) + margen para multipart.
    client_max_body_size 200m;
    client_body_timeout 120s;

    # Cabeceras que la app necesita para armar enlaces y cookies correctas.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_http_version 1.1;

    # Las subidas grandes se envían directo a la app (sin buffer en disco).
    proxy_request_buffering off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        # La app ya envía Cache-Control para CSS, JS, imágenes y uploads.
    }
}
