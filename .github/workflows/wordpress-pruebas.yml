name: WordPress de pruebas

# Publica el PLUGIN en un WordPress real (WordPress + MariaDB en el runner) y
# lo expone por un túnel HTTPS de Cloudflare. Es la prueba de verdad del plugin:
# PHP, MySQL, temas, permalinks y pagos, no una simulación.
#
# Cómo se usa:
#   1. Actions → «WordPress de pruebas» → Run workflow (rama a publicar).
#   2. El resumen del job trae la dirección, el usuario de la puerta y las
#      cuentas de WordPress.
#   3. El trabajo se queda encendido ~5 h 45 min. Al terminar, el enlace muere.
#
# Actualización automática: cada push a la rama NO relanza el workflow, porque
# eso mataría el enlace anterior. En su lugar, un paso comprueba el repositorio
# cada minuto y, cuando hay commits nuevos, actualiza el plugin en el WordPress
# en marcha. El enlace se mantiene y los cambios aparecen en menos de un minuto.

on:
  workflow_dispatch:
  push:
    paths:
      - '.vista-previa/wordpress'

concurrency:
  group: wordpress-de-pruebas
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

env:
  WP_URL: http://127.0.0.1:8080
  WP_TITULO: Jardín Memorial (pruebas)
  WP_ADMIN_USER: admin
  WP_ADMIN_PASS: JardinMemorial2026!
  WP_ADMIN_EMAIL: ccramireza@gmail.com
  WP_DB_NAME: wordpress
  WP_DB_USER: wordpress
  WP_DB_PASS: wordpress

jobs:
  publicar:
    name: Publicar WordPress de pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, gd, zip, curl, mysqli, intl
          coverage: none

      - name: Comprobar versiones
        run: |
          php -v | head -1
          for EXT in gd zip mysqli mbstring; do
            php -m | grep -qi "^${EXT}$" && echo "  ${EXT}: sí" || echo "  ${EXT}: NO"
          done

      - name: Preparar MariaDB
        run: |
          # El runner (Ubuntu 26.04) no trae servidor de base de datos y no usa
          # systemd: se instala y se arranca a mano.
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-server
          sudo mkdir -p /var/run/mysqld
          sudo chown mysql:mysql /var/run/mysqld
          sudo -u mysql mysqld_safe > /tmp/mysqld.log 2>&1 &
          echo $! > mysqld.pid

          for _ in $(seq 1 30); do
            sudo mysql -e 'SELECT 1' >/dev/null 2>&1 && break
            sleep 2
          done

          # root solo entra por socket (unix_socket); por TCP no tiene clave.
          sudo mysql -e "DROP DATABASE IF EXISTS ${WP_DB_NAME};"
          sudo mysql -e "CREATE DATABASE ${WP_DB_NAME} CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          sudo mysql -e "CREATE USER IF NOT EXISTS '${WP_DB_USER}'@'127.0.0.1' IDENTIFIED BY '${WP_DB_PASS}';"
          sudo mysql -e "ALTER USER '${WP_DB_USER}'@'127.0.0.1' IDENTIFIED BY '${WP_DB_PASS}';"
          sudo mysql -e "CREATE USER IF NOT EXISTS '${WP_DB_USER}'@'localhost' IDENTIFIED BY '${WP_DB_PASS}';"
          sudo mysql -e "ALTER USER '${WP_DB_USER}'@'localhost' IDENTIFIED BY '${WP_DB_PASS}';"
          sudo mysql -e "GRANT ALL PRIVILEGES ON ${WP_DB_NAME}.* TO '${WP_DB_USER}'@'127.0.0.1';"
          sudo mysql -e "GRANT ALL PRIVILEGES ON ${WP_DB_NAME}.* TO '${WP_DB_USER}'@'localhost';"
          sudo mysql -e "FLUSH PRIVILEGES;"

          # La prueba real: conectar como lo hará WordPress.
          mysql -h 127.0.0.1 -u"${WP_DB_USER}" -p"${WP_DB_PASS}" -e "SELECT VERSION() AS version;" "${WP_DB_NAME}"

      - name: Descargar WordPress y WP-CLI
        run: |
          curl -fsSL -o wordpress.tar.gz https://wordpress.org/latest.tar.gz
          tar xzf wordpress.tar.gz
          curl -fsSL -o wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x wp-cli.phar
          sudo mv wp-cli.phar /usr/local/bin/wp
          wp --info | head -3

      - name: Instalar WordPress
        run: |
          wp config create \
            --path=wordpress \
            --dbname="${WP_DB_NAME}" \
            --dbuser="${WP_DB_USER}" \
            --dbpass="${WP_DB_PASS}" \
            --dbhost=127.0.0.1 \
            --skip-check
          wp core install \
            --path=wordpress \
            --url="${WP_URL}" \
            --title="${WP_TITULO}" \
            --admin_user="${WP_ADMIN_USER}" \
            --admin_password="${WP_ADMIN_PASS}" \
            --admin_email="${WP_ADMIN_EMAIL}" \
            --skip-email
          # Permalinks bonitos: es lo que usa el plugin para /m/<slug>.
          wp rewrite structure '/%postname%/' --path=wordpress --hard
          wp theme install twentytwentyfour --activate --path=wordpress
          wp core version --path=wordpress

      - name: Instalar el plugin
        run: |
          mkdir -p wordpress/wp-content/plugins/jardin-memorial
          cp -a deploy/wordpress/plugin/jardin-memorial/. wordpress/wp-content/plugins/jardin-memorial/
          wp plugin activate jardin-memorial --path=wordpress
          wp plugin list --path=wordpress

      - name: Ajustar límites de subida
        run: |
          # El plugin acepta videos de hasta 120 MB; el PHP del runner trae 2 MB.
          INI="$(php --ini | sed -n 's/^Loaded Configuration File: *//p')"
          echo "php.ini: ${INI:-ninguno}"
          if [ -n "$INI" ] && [ -f "$INI" ]; then
            sudo sed -i 's/^upload_max_filesize.*/upload_max_filesize = 128M/' "$INI"
            sudo sed -i 's/^post_max_size.*/post_max_size = 132M/' "$INI"
            sudo sed -i 's/^memory_limit.*/memory_limit = 256M/' "$INI"
          else
            # Sin archivo cargado, se define una configuración propia.
            echo 'upload_max_filesize = 128M' >> /tmp/php-limites.ini
            echo 'post_max_size = 132M' >> /tmp/php-limites.ini
            echo 'memory_limit = 256M' >> /tmp/php-limites.ini
          fi
          php -r 'echo "límite: ", ini_get("upload_max_filesize"), "\n";'
          sudo chown -R www-data:www-data wordpress/wp-content

      - name: Sembrar el contenido (migración de la app Node)
        run: |
          node --version
          npm ci --no-audit --no-fund --ignore-scripts
          # Se exporta la base de la app Node tal como está en el repositorio
          # (memoriales de ejemplo) y se importa en WordPress.
          set -o pipefail
          echo "== sembrar =="
          DATA_DIR="$RUNNER_TEMP/datos-node" npm run seed-ejemplos 2>&1 | tail -20 || {
            echo "::error title=DIAG: falló seed-ejemplos::fin"; exit 1; }

          echo "== exportar =="
          DATA_DIR="$RUNNER_TEMP/datos-node" npm run export-wordpress -- --salida "$RUNNER_TEMP/export" 2>&1 | tail -20 || {
            echo "::error title=DIAG: falló export-wordpress::fin"; exit 1; }

          ZIP="$(ls "$RUNNER_TEMP"/export/*.zip | head -1)"
          echo "zip: $ZIP ($(du -h "$ZIP" | cut -f1))"

          echo "== importar =="
          set +e
          SALIDA=$(wp eval-file deploy/wordpress/cli/importar.php "$ZIP" --path=wordpress 2>&1)
          CODIGO=$?
          set -e
          echo "$SALIDA"
          if [ $CODIGO -ne 0 ]; then
            MENSAJE=$(echo "$SALIDA" | tr '\n' '|' | tr -d '`' | cut -c1-850)
            echo "::error title=DIAG importar (código $CODIGO): $MENSAJE::fin"
            exit 1
          fi
          wp plugin list --path=wordpress
          wp user list --path=wordpress --fields=ID,user_login,user_email,roles

      - name: Publicar las páginas del plugin
        run: |
          wp eval 'JM_DB::maybe_upgrade(); JM_Frontend::create_pages(); flush_rewrite_rules();' --path=wordpress
          wp option get jm_pages --format=json --path=wordpress

      - name: Publicar diagnóstico si algo falló
        if: failure()
        run: |
          # Los logs del job no siempre son legibles desde la API: se publica un
          # resumen del estado real como anotación, que sí se puede consultar.
          {
            echo "mysql: $(sudo mysqladmin ping 2>&1 | head -1)"
            echo "wp-cli: $(wp --version 2>&1 | head -1)"
            echo "wp-dir: $(ls wordpress/wp-config.php 2>&1)"
            echo "plugins: $(wp plugin list --path=wordpress --field=name 2>&1 | tr '\n' ',' | head -c 200)"
            echo "mysqld: $(tail -3 /tmp/mysqld.log 2>&1 | tr '\n' ' ' | head -c 300)"
            echo "php: $(php -v 2>&1 | head -1)"
          } > /tmp/diag.txt
          TITULO=$(tr '\n' '|' < /tmp/diag.txt | tr -d '`' | cut -c1-900)
          echo "::error title=DIAG: ${TITULO}::fin"

      - name: Abrir el túnel
        id: tunel
        run: |
          curl -fsSL -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          ./cloudflared tunnel --url http://127.0.0.1:8080 --no-autoupdate > cloudflared.log 2>&1 &
          echo $! > cloudflared.pid

          URL=""
          for _ in $(seq 1 60); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' cloudflared.log | head -1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then
            echo "No se pudo abrir el túnel"; cat cloudflared.log; exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Túnel: $URL"

          # WordPress arma enlaces absolutos con su `home`: si sigue apuntando a
          # 127.0.0.1, cada visita redirige fuera del túnel (301). Se cambia a la
          # dirección pública antes de comprobar nada.
          wp option update home "$URL" --path=wordpress
          wp option update siteurl "$URL" --path=wordpress
          wp rewrite flush --hard --path=wordpress

      - name: Servir el sitio y la puerta de acceso
        env:
          GATE_PASSWORD: demo-jardin-2026
          URL: ${{ steps.tunel.outputs.url }}
        run: |
          # El túnel apunta al puerto 8080: detrás está la puerta con usuario y
          # contraseña y, más atrás, el WordPress real en el 8081.
          LIMITES=""
          [ -f /tmp/php-limites.ini ] && LIMITES="-c /tmp/php-limites.ini"
          PHP_CLI_SERVER_WORKERS=8 php $LIMITES -S 127.0.0.1:8081 -t wordpress > wp.log 2>&1 &
          echo $! > wp.pid
          GATE_PASSWORD="$GATE_PASSWORD" \
          GATE_USER=demo APP_PORT=8081 PORT=8080 \
          PUBLIC_HOST="${URL#https://}" \
            node scripts/acceso-privado.js > puerta.log 2>&1 &
          echo $! > puerta.pid
          sleep 3
          curl -s -o /dev/null -w 'WP directo: %{http_code}\n' -H 'Host: 127.0.0.1:8081' http://127.0.0.1:8081/
          cat wp.log | tail -5

      - name: Comprobar el enlace público
        env:
          URL: ${{ steps.tunel.outputs.url }}
        run: |
          for _ in $(seq 1 40); do
            CODE=$(curl -s --location-trusted -u 'demo:demo-jardin-2026' -o /dev/null -w '%{http_code}' "$URL/")
            [ "$CODE" = "200" ] && break
            sleep 3
          done
          echo "Inicio: $CODE"
          PROBLEMAS=""
          [ "$CODE" = "200" ] || PROBLEMAS="inicio=$CODE;"

          CRED='demo:demo-jardin-2026'
          # --location-trusted conserva la autenticación en las redirecciones
          # internas del mismo sitio (WordPress normaliza /m/x → /m/x/).
          curl_sitio() { curl -s --location-trusted -u "$CRED" -o /dev/null -w '%{http_code}' "$@"; }

          for RUTA in /memoriales/ /planes/ /mi-jardin/ /crear-cuenta/; do
            C=$(curl_sitio "$URL$RUTA")
            echo "  $RUTA → $C"
            [ "$C" = "200" ] || PROBLEMAS="${PROBLEMAS}${RUTA}=$C;"
          done

          for SLUG in rosa-elena-munoz oscar-contreras-pena camila-fuentes-rojas nala; do
            C=$(curl_sitio "$URL/m/$SLUG")
            echo "  /m/$SLUG → $C"
            [ "$C" = "200" ] || PROBLEMAS="${PROBLEMAS}/m/$SLUG=$C;"
          done

          if [ -n "$PROBLEMAS" ]; then
            # Se mira qué dice WordPress en el inicio para orientar el arreglo.
            DETALLE=$(curl -s --location-trusted -u 'demo:demo-jardin-2026' "$URL/" | tr '\n' ' ' | sed 's/<[^>]*>//g' | tr -s ' ' | cut -c1-300)
            echo "::error title=DIAG enlace: ${PROBLEMAS} :: texto: ${DETALLE}::fin"
            exit 1
          fi

      - name: Publicar el enlace
        env:
          URL: ${{ steps.tunel.outputs.url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## WordPress de pruebas"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| **Sitio** | $URL |"
            echo "| **Usuario de la puerta** | \`demo\` |"
            echo "| **Contraseña de la puerta** | \`demo-jardin-2026\` |"
            echo "| **Administrador de WordPress** | \`${WP_ADMIN_USER}\` / \`${WP_ADMIN_PASS}\` |"
            echo "| **Escritorio** | $URL/wp-admin/ |"
            echo
            echo "Los cambios que se suban a la rama se aplican solos en menos de un minuto."
            echo "El enlace se apaga al terminar este trabajo (~6 horas)."
          } | tee -a "$GITHUB_STEP_SUMMARY"

          # El enlace se guarda en la rama y en una incidencia: el resumen del
          # trabajo y los artefactos no se pueden consultar desde fuera.
          echo "$URL" > enlace.txt
          echo "demo" >> enlace.txt
          echo "demo-jardin-2026" >> enlace.txt
          echo "${WP_ADMIN_USER}" >> enlace.txt
          echo "${WP_ADMIN_PASS}" >> enlace.txt

          git config user.name "Jardín Memorial"
          git config user.email "bot@jardinmemorial.cl"
          # La incidencia es la vía legible: los logs, el resumen del trabajo y
          # los artefactos de Actions no se pueden consultar desde fuera.
          echo "::notice title=ENLACE: $URL::Puerta demo/demo-jardin-2026 · WordPress ${WP_ADMIN_USER}/${WP_ADMIN_PASS}"
          echo "Enlace guardado en la rama ${GITHUB_REF_NAME}"

          gh issue create \
            --title "ENLACE: $URL" \
            --body "Puerta: demo / demo-jardin-2026 · WordPress: ${WP_ADMIN_USER} / ${WP_ADMIN_PASS}" \
            || echo "No se pudo abrir la incidencia con el enlace"

      - name: Guardar el enlace como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: enlace-wordpress
          path: enlace.txt
          retention-days: 1

      - name: Mantener encendido y aplicar cambios de la rama
        run: |
          RAMA="${GITHUB_REF_NAME}"
          ULTIMO="${GITHUB_SHA}"
          echo "Vigilando la rama ${RAMA} desde ${ULTIMO}"

          for _ in $(seq 1 340); do
            sleep 60

            if ! kill -0 "$(cat wp.pid)" 2>/dev/null; then
              echo "El servidor PHP se detuvo:"; tail -40 wp.log; exit 1
            fi

            NUEVO=$(git ls-remote origin "refs/heads/${RAMA}" | cut -f1)
            if [ -n "$NUEVO" ] && [ "$NUEVO" != "$ULTIMO" ]; then
              echo "Cambios nuevos (${ULTIMO} → ${NUEVO}); actualizando…"
              # Un fallo al actualizar se anota y se sigue sirviendo la versión
              # anterior: el enlace no se debe caer por un commit a medias.
              if git fetch origin "${RAMA}" --quiet \
                 && git checkout --quiet FETCH_HEAD \
                 && cp -a deploy/wordpress/plugin/jardin-memorial/. \
                      wordpress/wp-content/plugins/jardin-memorial/ \
                 && wp eval 'JM_DB::maybe_upgrade();' --path=wordpress \
                 && wp cache flush --path=wordpress; then
                echo "Actualizado a ${NUEVO}."
              else
                echo "::warning title=Actualización fallida: ${NUEVO}::Se conserva la versión anterior; revisar el commit."
              fi
              ULTIMO="$NUEVO"
            fi
          done
