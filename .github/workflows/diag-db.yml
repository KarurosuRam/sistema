name: Diagnóstico DB
on:
  push:
    paths:
      - '.vista-previa/diag'
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar y arrancar MariaDB
        run: |
          sudo apt-get update -qq >/dev/null 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-server >/dev/null 2>&1
          sudo mkdir -p /var/run/mysqld && sudo chown mysql:mysql /var/run/mysqld
          sudo -u mysql mysqld_safe >/tmp/mysqld.log 2>&1 &
          sleep 12
          echo "SOCKET: $(sudo mysql -e 'SELECT 1' 2>&1 | tr '\n' ' ' | cut -c1-120)" > /tmp/r1
          echo "TCP: $(mysql -h 127.0.0.1 -uroot -e 'SELECT 1' 2>&1 | tr '\n' ' ' | cut -c1-120)" > /tmp/r2
          echo "LOG: $(tail -6 /tmp/mysqld.log 2>&1 | tr '\n' ' ' | cut -c1-300)" > /tmp/r3
          echo "ERR: $(sudo tail -6 /var/log/mysql/error.log 2>&1 | tr '\n' ' ' | cut -c1-300)" > /tmp/r4
          echo "PROC: $(ps aux | grep -c '[m]ysqld')" > /tmp/r5
      - name: Publicar resultado
        run: |
          TITULO=$(cat /tmp/r1 /tmp/r2 /tmp/r3 /tmp/r4 /tmp/r5 | tr '\n' '|' | tr -d '`' | cut -c1-240)
          echo "::error title=$TITULO::fin"
