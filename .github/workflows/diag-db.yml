name: Diagnóstico DB
on:
  push:
    paths:
      - '.vista-previa/diag'
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar y arrancar MariaDB
        run: |
          sudo apt-get update -qq >/dev/null 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-server >/dev/null 2>&1
          sudo mkdir -p /var/run/mysqld && sudo chown mysql:mysql /var/run/mysqld
          sudo -u mysql mysqld_safe >/tmp/mysqld.log 2>&1 &
          sleep 12
          sudo mysql -e "CREATE DATABASE IF NOT EXISTS wordpress CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          sudo mysql -e "CREATE USER IF NOT EXISTS 'wordpress'@'localhost' IDENTIFIED BY 'wordpress';"
          sudo mysql -e "CREATE USER IF NOT EXISTS 'wordpress'@'127.0.0.1' IDENTIFIED BY 'wordpress';"
          sudo mysql -e "GRANT ALL PRIVILEGES ON wordpress.* TO 'wordpress'@'localhost';"
          sudo mysql -e "GRANT ALL PRIVILEGES ON wordpress.* TO 'wordpress'@'127.0.0.1';"
          sudo mysql -e "FLUSH PRIVILEGES;"
          echo "USUARIO: $(mysql -h 127.0.0.1 -uwordpress -pwordpress -e 'SELECT DATABASE()' wordpress 2>&1 | tr '\n' ' ' | cut -c1-150)" > /tmp/r1
          echo "TABLA: $(mysql -h 127.0.0.1 -uwordpress -pwordpress -e 'CREATE TABLE t(i int); DROP TABLE t;' wordpress 2>&1 | tr '\n' ' ' | cut -c1-150)" > /tmp/r2
      - name: Publicar resultado
        run: |
          TITULO=$(cat /tmp/r1 /tmp/r2 | tr '\n' '|' | tr -d '`' | cut -c1-240)
          echo "::error title=$TITULO::fin"
