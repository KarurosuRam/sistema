name: Diagnóstico DB
on:
  push:
    paths:
      - '.vista-previa/diag'
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar MariaDB
        run: |
          OUT=/tmp/diag.txt
          {
            echo "== apt update =="; sudo apt-get update -qq 2>&1 | tail -3
            echo "== instalar =="; sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-server 2>&1 | tail -5
            echo "== binario =="; which mariadbd mysqld 2>&1 || true
            echo "== arranque =="; sudo systemctl start mariadb 2>&1 | head -3 || true
            sudo service mariadb start 2>&1 | head -3 || true
            sleep 4
            echo "== activo =="; systemctl is-active mariadb 2>&1 || true
            echo "== root =="; sudo mysql -e "SELECT VERSION();" 2>&1 | head -3
          } 2>&1 | tee "$OUT"
          while IFS= read -r linea; do
            [ -n "$linea" ] && echo "::warning title=DIAG::$linea"
          done < "$OUT"
